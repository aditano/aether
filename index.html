<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether</title>
    <meta
      name="description"
      content="Aether is a weather observatory: a plain-language briefing, a 24-hour arc of the sky, and live radar."
    />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#app">Skip to content</a>
    <div class="sky" id="sky" data-kind="clear" data-tod="day" aria-hidden="true"></div>
    <div id="radar-park" class="radar-park">
      <section id="radar-root" class="radar-root">
        <div id="studio-hud" class="studio-hud"></div>
        <header id="radar-head" class="radar-head"></header>
        <div id="radar-map" class="radar-map"></div>
        <footer id="radar-foot" class="radar-foot"></footer>
      </section>
    </div>
    <div class="wrap" id="app"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.0/leaflet-maplibre-gl.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
